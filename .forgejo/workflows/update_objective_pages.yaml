name: Update objective pages

on:
  schedule:
    - cron: '54 5 * * 1-5'
  workflow_dispatch:

jobs:
  create_pages:
    runs-on: debian-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install tools
        run: .forgejo/tools/install_tools
      - name: Prepare Git
        run: .forgejo/tools/prep_git
      - name: Update pages
        run: |
          dtc read-pages https://pool.psychoinformatics.de/api/public/records/p/XYZObjective \
          | qrg inline-records -p part_of --api-url https://pool.psychoinformatics.de/api -c public \
          | qrg inline-records -p depends_on --api-url https://pool.psychoinformatics.de/api -c public \
          | qrg render-record page_templates/objective.md.j2 'content/{__pid_curie_reference}/_index.md'
      - name: Deposit changes
        run: .forgejo/tools/deposit_changes
