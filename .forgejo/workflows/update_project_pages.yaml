name: Update project pages

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

env:
  DUMPTHINGS_APIURL: https://pool.psychoinformatics.de/api

jobs:
  create_pages:
    runs-on: debian-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Prepare environment
        uses: ./.forgejo/actions/prep-metadata-query
      - name: Install jq
        run: |
          curl -o ~/.local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64
          chmod +x ~/.local/bin/jq
          jq --version
      - name: Update pages
        run: |
          dtc get-records $DUMPTHINGS_APIURL public -C XYZProject \
          | qrg filter-links-pid --link part_of xyzrins:. --recursive --collection public \
          | while read rec; do projpid="$(echo $rec | jq -r '.pid')"; echo "$rec" | jq -c ". + {generated: $(dtc get-records ${DUMPTHINGS_APIURL} public --matching "$projpid" | jq -c ". | select(.generated_by[]?.object == \"$projpid\")" | jq -c --slurp)}"; done \
          | qrg inline-records -c public -p associated_with -p associated_with::roles -p identifiers::creator -p part_of > stuff.json
          qrg render-record page_templates/project.md.j2 'content/{__pid_curie_reference}/_index.md' < stuff.json
          jq < stuff.json
      - name: Deposit changes
        uses: ./.forgejo/actions/deposit-changes
