name: Update project pages

# run daily (5:15 on weekdays) and on manual dispatch
on:
  schedule:
    - cron: '16 5 * * 1-5'
  workflow_dispatch:

jobs:
  create_pages:
    runs-on: debian-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install tools
        run: .forgejo/tools/install_tools
      - name: Prepare Git
        run: .forgejo/tools/prep_git

      - name: Update pages
        run: |
          read-pages https://pool.psychoinformatics.de/api/public/records/p/XYZProject \
          | qrg filter-links-pid --link part_of xyzrsens:projects/4b434ab4-929e-4d64-97e0-ff334c6a6ff2 --recursive --api-url https://pool.psychoinformatics.de/api --collection public \
          | qrg render-record page_templates/project.md.j2 'content/{__pid_curie_reference}/_index.md'
      - name: Commit and push updates
        id: commit
        run: |
          git add content
          git diff --quiet --cached && echo "Already up-to-date" || ( git commit -m "feat: auto-generate project pages" && git push origin )
